<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>cmdk-zero — dialog</title>
    <link rel="stylesheet" href="/cmdk-zero.css">
    <script type="module" src="/setup.js"></script>
  </head>
  <body>
    <button data-testid="open">Open</button>

    <dialog id="menu">
      <cmdk-root label="Global Command Menu">
        <input placeholder="Search…" autofocus>
        <cmdk-list>
          <cmdk-empty>No results.</cmdk-empty>
          <cmdk-item>Item</cmdk-item>
          <cmdk-item value="xxx">Value</cmdk-item>
        </cmdk-list>
      </cmdk-root>
    </dialog>

    <script type="module">
      const dialog = document.getElementById("menu")

      document.querySelector("[data-testid=open]").addEventListener("click", () => dialog.showModal())

      // Toggle the menu when ⌘K (or Ctrl+K) is pressed.
      document.addEventListener("keydown", event => {
        if (event.key === "k" && (event.metaKey || event.ctrlKey)) {
          event.preventDefault()
          dialog.open ? dialog.close() : dialog.showModal()
        }
      })

      dialog.addEventListener("cmdk:select", () => dialog.close())
    </script>
  </body>
</html>
